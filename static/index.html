<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold text-gray-900">CVE Dashboard</h1>
                <p class="text-gray-600">Vulnerability aggregation from NVD and GitHub</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Controls -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <!-- Search NVD -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search NVD (Product)</label>
                        <div class="flex gap-2">
                            <input type="text" id="nvdSearch" placeholder="e.g., apache" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button onclick="searchNVD()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Search</button>
                        </div>
                    </div>

                    <!-- Search GitHub -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search GitHub (Package)</label>
                        <div class="flex gap-2">
                            <input type="text" id="githubSearch" placeholder="e.g., express" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button onclick="searchGithub()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Search</button>
                        </div>
                    </div>

                    <!-- View -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">View</label>
                        <select id="viewSelect" onchange="switchView()" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="home">Homepage</option>
                            <option value="nvd">All NVD</option>
                            <option value="github">All GitHub</option>
                        </select>
                    </div>
                </div>

                <!-- Sync Buttons -->
                <div class="flex gap-2">
                    <button onclick="syncNVD()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Sync NVD</button>
                    <button onclick="syncGithub()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Sync GitHub</button>
                    <span id="syncStatus" class="text-sm text-gray-600 self-center"></span>
                </div>
            </div>

            <!-- Heatmap -->
            <div class="bg-white rounded-lg shadow p-6 mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Vulnerability Heatmap</h2>
                <canvas id="heatmapChart"></canvas>
            </div>

            <!-- Vulnerabilities -->
            <div id="container"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
